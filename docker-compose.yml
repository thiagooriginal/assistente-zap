version: '3.8'

services:
  assistente-zap:
    build: .
    container_name: assistente-zap
    restart: always
    ports:
      - "3333:3333"
    environment:
      - PORT=3333
      - TZ=America/Sao_Paulo
    env_file:
      - .env
    volumes:
      # Pastas persistentes essenciais para não perder o WhatsApp nem os dados
      - ./auth_info_baileys:/app/auth_info_baileys
      - ./data:/app/data
      - ./google_token.json:/app/google_token.json
      - ./google_credentials.json:/app/google_credentials.json
