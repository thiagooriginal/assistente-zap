<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Área do Cliente • RAIA AGENTES | Login</title>
  <link rel="icon" type="image/png" href="/raia-emblem-small.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            raia: {
              black: '#07080c',
              card: '#11131a',
              cardHover: '#181b24',
              border: 'rgba(255, 255, 255, 0.08)',
              neon: '#00F59B',
              lime: '#ccff00',
              violet: '#8B5CF6',
              gold: '#F59E0B',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          }
        }
      }
    };
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="bg-[#07080c] text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden selection:bg-[#00F59B]/20 selection:text-[#00F59B]">

  <!-- Background decorative glows -->
  <div class="fixed top-[-150px] left-1/2 -translate-x-1/2 w-[600px] h-[350px] bg-gradient-to-b from-[#00F59B]/15 via-[#8B5CF6]/10 to-transparent blur-[120px] pointer-events-none -z-10"></div>
  <div class="fixed bottom-[-100px] right-[-100px] w-[400px] h-[400px] bg-[#8B5CF6]/10 blur-[140px] pointer-events-none -z-10"></div>

  <div class="w-full max-w-md">
    <!-- Header / Brand -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-3 group mb-4">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-[#00F59B]/20 to-[#8B5CF6]/20 border border-white/10 flex items-center justify-center shadow-lg shadow-[#00F59B]/10 group-hover:scale-105 transition-transform duration-300">
          <img src="/raia-emblem-small.png" alt="RAIA" class="w-7 h-7 object-contain">
        </div>
        <div class="text-left">
          <div class="text-xl font-extrabold tracking-tight text-white flex items-center gap-1.5">
            RAIA <span class="text-xs px-2 py-0.5 rounded-full bg-[#00F59B]/10 text-[#00F59B] border border-[#00F59B]/30 font-semibold tracking-normal">CLIENTE</span>
          </div>
          <div class="text-[11px] text-slate-400 font-medium tracking-wide">PORTAL DO ASSINANTE</div>
        </div>
      </a>
      <h1 class="text-2xl font-bold text-white tracking-tight">Acesse o painel do seu salão</h1>
      <p class="text-sm text-slate-400 mt-1.5">Gerencie seu assistente Jéssica, serviços e agendamentos</p>
    </div>

    <!-- Login Card -->
    <div class="bg-[#11131a] border border-white/10 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl relative">
      <div id="alertBox" class="hidden mb-5 p-3.5 rounded-xl text-sm border flex items-start gap-3"></div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">E-mail de Acesso</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <input
              type="email"
              id="email"
              required
              placeholder="seuemail@exemplo.com"
              class="w-full bg-[#07080c] border border-white/10 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#00F59B] focus:ring-1 focus:ring-[#00F59B] transition-all"
            >
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Senha</label>
            <a href="/cliente/recuperar-senha" class="text-xs font-medium text-[#00F59B] hover:underline">Esqueceu a senha?</a>
          </div>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <input
              type="password"
              id="password"
              required
              placeholder="••••••••"
              class="w-full bg-[#07080c] border border-white/10 rounded-xl pl-10 pr-11 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#00F59B] focus:ring-1 focus:ring-[#00F59B] transition-all"
            >
            <button
              type="button"
              id="togglePassword"
              class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors"
            >
              <i data-lucide="eye" id="eyeIcon" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <button
          type="submit"
          id="submitBtn"
          class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-[#00F59B] to-[#00D284] text-[#07080c] font-bold text-sm hover:brightness-110 active:scale-[0.99] transition-all shadow-lg shadow-[#00F59B]/20 flex items-center justify-center gap-2"
        >
          <span>Entrar no Painel</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <!-- Hotmart Activation Link -->
      <div class="mt-6 pt-5 border-t border-white/5 text-center">
        <p class="text-xs text-slate-400">
          Comprou pela Hotmart e ainda não criou sua senha?
        </p>
        <a href="/cliente/ativar" class="inline-flex items-center gap-1.5 text-xs font-semibold text-[#00F59B] hover:underline mt-1.5">
          <span>Ativar minha conta agora</span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
        </a>
      </div>
    </div>

    <!-- Security & Footer -->
    <div class="text-center mt-8 space-y-2">
      <div class="inline-flex items-center gap-2 text-xs text-slate-500">
        <i data-lucide="shield-check" class="w-3.5 h-3.5 text-[#00F59B]"></i>
        <span>Ambiente Criptografado & Protegido por Hotmart Webhooks</span>
      </div>
      <div>
        <a href="/" class="text-xs text-slate-400 hover:text-white transition-colors">Voltar à página inicial</a>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');

    // Toggle password visibility
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
      lucide.createIcons();
    });

    function showAlert(message, type = 'error') {
      alertBox.className = type === 'error'
        ? 'mb-5 p-3.5 rounded-xl text-sm border border-red-500/30 bg-red-500/10 text-red-300 flex items-start gap-3'
        : 'mb-5 p-3.5 rounded-xl text-sm border border-emerald-500/30 bg-emerald-500/10 text-emerald-300 flex items-start gap-3';
      alertBox.innerHTML = `
        <i data-lucide="${type === 'error' ? 'alert-triangle' : 'check-circle-2'}" class="w-5 h-5 flex-shrink-0 mt-0.5"></i>
        <div>${message}</div>
      `;
      alertBox.classList.remove('hidden');
      lucide.createIcons();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="inline-block animate-spin mr-2">⟳</span> Entrando...';

      try {
        const res = await fetch('/api/cliente/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: emailInput.value.trim(),
            password: passwordInput.value,
          }),
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          showAlert(data.error || 'Erro ao efetuar login. Verifique suas credenciais.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Entrar no Painel</span><i data-lucide="arrow-right" class="w-4 h-4"></i>';
          lucide.createIcons();
          return;
        }

        // Store token in session storage as backup
        if (data.token) {
          sessionStorage.setItem('raia_client_token', data.token);
        }

        showAlert('Login realizado com sucesso! Redirecionando...', 'success');
        setTimeout(() => {
          window.location.href = '/cliente/painel';
        }, 600);
      } catch (err) {
        showAlert('Erro de conexão com o servidor. Tente novamente.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Entrar no Painel</span><i data-lucide="arrow-right" class="w-4 h-4"></i>';
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
